# Local development. For production, provide HTTPS and separate runtime DB roles.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: commission
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: commission
    ports: ['127.0.0.1:5432:5432']
    volumes: ['database:/var/lib/postgresql']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U commission -d commission']
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    command: ['migrate']
    environment:
      DATABASE_URL: postgres://commission:${POSTGRES_PASSWORD}@db:5432/commission
    depends_on:
      db:
        condition: service_healthy
  app:
    build: .
    environment:
      DATABASE_URL: postgres://commission:${POSTGRES_PASSWORD}@db:5432/commission
      BIND_ADDR: 0.0.0.0:8080
      METRICS_BIND_ADDR: 0.0.0.0:9091
      RELEASE_WORKER: 'true'
      PLATFORM_SYNC_WORKER: 'false'
      PLATFORM_SYNC_INTERVAL_SECONDS: '60'
      RUST_LOG: commission=info,tower_http=info
    ports: ['127.0.0.1:8081:8080']
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    stop_grace_period: 40s
  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports: ['127.0.0.1:9090:9090']
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus-alerts.yml:/etc/prometheus/rules/commission.yml:ro
      - prometheus:/prometheus
    depends_on:
      app:
        condition: service_started
  grafana:
    profiles: [observability]
    image: grafana/grafana:13.2.2
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-commission-local-only}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    ports: ['127.0.0.1:3000:3000']
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
  console:
    profiles: [web]
    build:
      context: .
      dockerfile: apps/console/Dockerfile
    ports: ['127.0.0.1:8080:80']
    depends_on: [app]
volumes:
  database:
  prometheus:
  grafana:
