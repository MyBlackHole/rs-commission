[package]
name = "commission-types"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Only the backend enables database mappings; browser/native clients do not.
postgres = ["dep:sqlx"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
uuid = { version = "1", features = ["serde"] }
thiserror = "2"
sqlx = { version = "=0.8.6", optional = true, default-features = false, features = ["postgres", "uuid", "chrono", "json", "macros"] }

[dev-dependencies]
proptest = "1"
