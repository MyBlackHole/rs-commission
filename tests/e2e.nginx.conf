pid /tmp/commission-e2e-nginx.pid;
error_log /tmp/commission-e2e-nginx-error.log notice;

events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /tmp/commission-e2e-nginx-access.log;

    server {
        listen 127.0.0.1:8090;
        server_name localhost;
        root /tmp/rs-commission-web;
        index index.html;
        client_max_body_size 64k;

        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;

        location /api/ {
            proxy_pass http://127.0.0.1:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 35s;
            proxy_next_upstream off;
        }

        location /health/ {
            proxy_pass http://127.0.0.1:8081;
            proxy_next_upstream off;
        }

        location = /index.html {
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
