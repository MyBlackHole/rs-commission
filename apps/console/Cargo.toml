[package]
name = "commission-console"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "commission_console"
path = "src/main.rs"

[features]
default = []
# Only selects transport: the same Leptos pages are used on every platform.
tauri = []

[dependencies]
commission-types = { path = "../../crates/commission-types" }
commission-client = { path = "../../crates/commission-client" }
leptos = { version = "=0.8.20", default-features = false, features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4", "js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["Window", "Location", "BeforeUnloadEvent"] }
