# Temporary source migration runner; removed after normalization.
name: Workspace migration
on:
  push:
    branches: [feat/rust-cross-platform]
    paths: ['.github/workflows/bootstrap-workspace.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rust-cross-platform
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Complete source migration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/commission-client/src/lib.rs')
          s = p.read_text().replace('reqwest::url::Host', 'url::Host')
          s = s.replace('Self::RequestPayout => &["operator", "finance", "member"]', 'Self::RequestPayout => &["operator", "member"]')
          p.write_text(s)
          p = Path('crates/commission-client/Cargo.toml')
          s = p.read_text()
          if '\nurl = ' not in s:
              s = s.replace('thiserror = "2"', 'thiserror = "2"\nurl = "2"')
          p.write_text(s)
          p = Path('apps/console/src/main.rs')
          s = p.read_text().replace('strong { "{content}" } } }\n', 'strong { "{content}" } } } }\n')
          p.write_text(s)
          p = Path('src/http/mod.rs')
          s = p.read_text().replace('response::{Html, IntoResponse, Response},\n', '')
          s = s.replace('        .route("/app.js", get(javascript))\n', '').replace('        .route("/app.css", get(stylesheet))\n', '')
          start = s.index('async fn index()')
          end = s.index('async fn ready(', start)
          s = s[:start] + 'async fn index() -> Json<Value> { Json(json!({"service":"commission-api","version":env!("CARGO_PKG_VERSION"),"console":"Run commission-console; this process serves API only"})) }\n' + s[end:]
          p.write_text(s)
          for name in ['web/app.js', 'web/app.css', 'web/index.html', 'tests/frontend.test.cjs', 'docs/FRONTEND_QA.json']:
              Path(name).unlink(missing_ok=True)
          PY
      - run: cargo fmt --all
      - run: cargo generate-lockfile
      - name: Commit normalization to migration branch only
        run: |
          test "$GITHUB_REF" = 'refs/heads/feat/rust-cross-platform'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'chore: normalize Rust workspace and lock dependencies'
          git push origin HEAD:refs/heads/feat/rust-cross-platform
      - name: Snapshot normalized source
        if: always()
        run: tar --exclude=.git --exclude=target -czf "$RUNNER_TEMP/workspace.tar.gz" .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-source
          path: ${{ runner.temp }}/workspace.tar.gz
