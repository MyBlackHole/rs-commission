[workspace]
members = [".", "crates/commission-types", "crates/commission-client", "apps/console", "apps/console/src-tauri"]
default-members = [".", "crates/commission-types", "crates/commission-client"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"

[package]
name = "commission-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "中文平台抽佣、推广返佣与结算业务账本"
default-run = "commissiond"

[lib]
name = "commission"
path = "src/lib.rs"

[[bin]]
name = "commissiond"
path = "src/main.rs"

[dependencies]
commission-types = { path = "crates/commission-types", features = ["postgres"] }
axum = { version = "=0.8.9", features = ["macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
rand = "0.8"
hex = "0.4"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tower-http = { version = "0.6", features = ["trace", "set-header", "limit"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
proptest = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
